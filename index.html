<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="pokedex-topo">
      <div class="lente-principal"></div>
      <div class="leds-status">
        <span class="led vermelho"></span>
        <span class="led amarelo"></span>
        <span class="led verde"></span>
      </div>
      <h1>POKÉDEX</h1>
    </header>
    
    <div class="controles">
      <div class="busca-wrapper">
        <input type="text" id="input-busca" placeholder="Nome ou número (ex: pikachu ou 25)" autocomplete="off">
        <ul id="lista-sugestoes" class="sugestoes-lista oculto"></ul>
      </div>
      <button id="btn-buscar">Buscar</button>
      <button id="btn-aleatorio">Aleatório</button>
    </div>

    <div id="favoritos-secao" class="favoritos-secao oculto">
      <h3>⭐ Favoritos</h3>
      <div id="lista-favoritos" class="favoritos-lista"></div>
    </div>

    <p id="mensagem-status"></p>

    <section id="card-pokemon" class="oculto">
      <div id="poke-variacoes" class="variacoes-container oculto"></div>

      <div class="cabecalho">
        <button type="button" id="btn-anterior" class="btn-nav" title="Pokémon anterior">&#9664;</button>
        <div class="titulo-pokemon">
          <h2 id="poke-nome"></h2>
          <span id="poke-id"></span>
        </div>
        <button type="button" id="btn-proximo" class="btn-nav" title="Próximo Pokémon">&#9654;</button>
      </div>

      <div class="visor-moldura">
        <div class="visor-leds">
          <span></span>
          <span></span>
        </div>
        <div class="foto-container">
          <img id="poke-foto" src="" alt="Imagem do Pokémon">
        </div>
        <div class="visor-rodape">
          <span class="visor-botao-vermelho"></span>
          <div class="visor-alto-falante">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <div class="acoes-midia">
        <button type="button" id="btn-shiny" class="btn-midia oculto">✨ Shiny</button>
        <button type="button" id="btn-som" class="btn-midia oculto">🔊 Som</button>
        <button type="button" id="btn-favoritar" class="btn-midia">☆ Favoritar</button>
      </div>

      <div id="poke-tipos" class="badges"></div>

      <p id="poke-descricao" class="descricao-pokedex"></p>

      <div class="medidas">
        <p><strong>Altura:</strong> <span id="poke-altura"></span> cm</p>
        <p><strong>Peso:</strong> <span id="poke-peso"></span> kg</p>
      </div>

      <div class="secao">
        <h3>Habilidades</h3>
        <ul id="poke-habilidades"></ul>
      </div>

      <div class="secao">
        <h3>Estatísticas</h3>
        <div id="poke-stats" class="stats-grafico"></div>
      </div>

      <div class="secao">
        <h3>Cadeia Evolutiva</h3>
        <div id="poke-evolucoes" class="evolucoes-lista"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
